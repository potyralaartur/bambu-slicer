<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#1d1f20" />
    <title>Bambu Studio Turntable</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="turntable" id="turntable" aria-label="3D model turntable">
      <canvas
        id="viewport"
        tabindex="0"
        aria-label="Interactive 3D viewport. Drag to rotate, shift-drag to move, and scroll to zoom."
      ></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>

      <div class="topbar">
        <div class="model-chip" id="modelChip" aria-live="polite">
          <span class="model-dot"></span>
          <span class="model-name" id="modelName">3DBenchy.stl</span>
          <span class="triangle-count" id="triangleCount"></span>
        </div>

        <div class="actions">
          <button class="icon-button" id="fitButton" type="button" title="Fit view" aria-label="Fit view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4m13 5h4a1 1 0 0 0 1-1v-4" />
            </svg>
          </button>
          <button class="icon-button" id="resetButton" type="button" title="Reset view" aria-label="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.9 8.4A8 8 0 1 1 4 12m.9-3.6V4m0 4.4H9.3" />
            </svg>
          </button>
          <label class="import-button" for="stlInput">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" />
            </svg>
            <span>Import STL</span>
          </label>
          <input id="stlInput" type="file" accept=".stl,model/stl,application/sla" />
        </div>
      </div>

      <div class="loading" id="loading" role="status">
        <span class="spinner"></span>
        <span id="loadingLabel">Loading 3DBenchy…</span>
      </div>

      <div class="drop-zone" id="dropZone" aria-hidden="true">
        <div>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
          </svg>
          <strong>Drop STL to import</strong>
          <span>Binary and ASCII files are supported</span>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="turntable.js"></script>
  </body>
</html>
